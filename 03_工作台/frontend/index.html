<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="design-system.css?v=fixed-canvas-27">

</head>
<body>
  <div id="workbenchSplash" class="workbench-splash" role="status" aria-label="正在加载 AI 爆款内容工厂">
    <img src="/brand-assets/logo.png" alt="AI爆款内容工厂">
  </div>
  <aside class="sidebar">
    <div class="brand"><img src="/brand-assets/logo.png" alt="AI爆款内容工厂"></div>

  <button id="assistant" class="assistant" aria-label="打开小姜"><span class="assistant-avatar" aria-hidden="true"></span></button>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast"></div>
  <script src="app.js?v=folder-sync-2"></script>
